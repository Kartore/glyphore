[package]
name = "glyphore"
description = "MapLibre glyph PBF generation library and command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
documentation = "https://docs.rs/glyphore"
keywords = ["maplibre", "glyphs", "font", "pbf", "cli"]
categories = ["command-line-utilities", "graphics", "encoding"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "glyphore"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"], optional = true }
glyphore-core = { path = "../glyphore-core", version = "=0.2.0" }
