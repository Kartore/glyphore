[package]
name = "glyphore-core"
description = "MapLibre glyph PBF (SDF) generation core library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
documentation = "https://docs.rs/glyphore-core"
keywords = ["maplibre", "glyphs", "font", "pbf", "sdf"]
categories = ["graphics", "encoding"]

[dependencies]
fontdue = "0.9"
sdf_glyph_renderer = { version = "1", default-features = false }
thiserror = "2"
ttf-parser = "0.25"
