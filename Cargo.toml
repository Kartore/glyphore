[workspace]
resolver = "3"
members = [
	"crates/glyphore-core",
	"crates/glyphore-cli",
	"crates/glyphore-wasm",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kartore/glyphore"

[profile.release]
lto = true
codegen-units = 1
